name: Update ALDO IPTV

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and combine playlists
        run: |
          python - <<'PY'
          import urllib.request

          countries = [
              ("si", "Slovenija"),
              ("mk", "Severna Makedonija"),
              ("hr", "Hrvaška"),
              ("rs", "Srbija"),
              ("ba", "Bosna in Hercegovina"),
              ("me", "Črna gora"),
              ("de", "Nemčija"),
              ("at", "Avstrija"),
              ("it", "Italija"),
              ("tr", "Turčija"),
              ("gb", "Velika Britanija"),
              ("us", "ZDA"),
          ]

          output = ["#EXTM3U"]

          for code, name in countries:
              url = f"https://iptv-org.github.io/iptv/countries/{code}.m3u"
              output.append(f"\n# ===== {name} =====")
              try:
                  request = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0"}
                  )
                  data = urllib.request.urlopen(request, timeout=30).read()
                  content = data.decode("utf-8", errors="replace")
                  lines = content.splitlines()

                  for line in lines:
                      if line.strip() and line.strip() != "#EXTM3U":
                          output.append(line)
              except Exception as error:
                  print(f"Napaka pri {name}: {error}")

          with open("aldotv.m3u", "w", encoding="utf-8") as file:
              file.write("\n".join(output) + "\n")
          PY

      - name: Save updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aldotv.m3u
          git commit -m "Update ALDO IPTV playlist" || echo "No changes"
          git push
